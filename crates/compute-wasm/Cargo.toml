[package]
name = "compute-wasm"
version = "0.1.0"
edition = "2024"
description = "Obrato compute-wasm: тонкая WASM-обёртка над compute-core (Граница A, гл.09 §2). Единственное место с wasm-bindgen/serde/tsify (гл.13 §2) — ядро остаётся чистым."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
compute-core = { path = "../compute-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5", default-features = false, features = ["js"] }

[dev-dependencies]
serde_json = "1"
